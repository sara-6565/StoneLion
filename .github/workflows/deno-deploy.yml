name: Deno Deploy

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.1.4

      - name: Deploy to Deno Deploy
        run: |
          deno run --allow-all https://deno.land/x/deployctl/deployctl.ts deploy --project=${{ secrets.DENO_DEPLOY_PROJECT }} --prod server.ts
        env:
          DENO_AUTH_TOKENS: ${{ secrets.DENO_DEPLOY_TOKEN }}
